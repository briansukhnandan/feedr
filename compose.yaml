services:
  feedr:
    build: .
    image: feedr:local
    restart: unless-stopped
    # Match the host user's permissions so the delivery journal is writable.
    user: "${FEEDR_UID:-1000}:${FEEDR_GID:-1000}"
    # This file can contain credentials for any number of configured accounts.
    env_file:
      - "${FEEDR_CREDENTIALS_FILE:-$HOME/.feedr/credentials.env}"
    environment:
      FEEDR_HOME: /feedr
    volumes:
      - "${FEEDR_DATA_DIR:-$HOME/.feedr}:/feedr"
